<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CineVerse Receiver</title>
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Helvetica Neue',Arial,sans-serif;color:#fff}
#media-container{position:absolute;inset:0}
cast-media-player{width:100%;height:100%}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:48px 72px;background:linear-gradient(transparent 50%,rgba(0,0,0,.85));opacity:0;transition:opacity .4s;pointer-events:none}
#overlay.show{opacity:1}
#meta{margin-bottom:24px}
#series-label{font-size:20px;color:#aaa;margin-bottom:6px;letter-spacing:.5px}
#title{font-size:48px;font-weight:800;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.8)}
#subtitle{font-size:22px;color:#ccc;margin-top:8px}
#progress-wrap{display:flex;align-items:center;gap:16px;margin-bottom:12px}
#time-current{font-size:22px;font-weight:700;min-width:70px}
#progress-bar{flex:1;height:5px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}
#progress-fill{height:100%;background:#e50914;border-radius:3px;width:0%;transition:width .5s linear}
#time-total{font-size:22px;color:#aaa;min-width:70px;text-align:right}
#state-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;opacity:0;transition:opacity .3s}
#state-icon.show{opacity:1}
#logo{position:absolute;top:40px;right:60px;font-size:28px;font-weight:900;letter-spacing:1px;color:#e50914;text-transform:uppercase;opacity:.8}
#logo span{color:#fff}
</style>
</head>
<body>
<div id="media-container">
  <cast-media-player id="player"></cast-media-player>
</div>
<div id="overlay">
  <div id="meta">
    <div id="series-label"></div>
    <div id="title"></div>
    <div id="subtitle"></div>
  </div>
  <div id="progress-wrap">
    <div id="time-current">0:00</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="time-total">0:00</div>
  </div>
</div>
<div id="state-icon"></div>
<div id="logo">Cine<span>Verse</span></div>

<script>
const ctx = cast.framework.CastReceiverContext.getInstance();
const pm  = ctx.getPlayerManager();

// HLS cu segmente TS
ctx.setInbandTracksEnabled(true);

// Optiuni player
const opts = new cast.framework.CastReceiverOptions();
opts.useLegacyDashSupport = false;
opts.skipMpluginsForMediaInfo = false;
// permite subtitrarile externe
opts.customNamespaces = {};

// UI refs
const overlay   = document.getElementById('overlay');
const titleEl   = document.getElementById('title');
const seriesEl  = document.getElementById('series-label');
const subtitleEl= document.getElementById('subtitle');
const fillEl    = document.getElementById('progress-fill');
const curEl     = document.getElementById('time-current');
const totEl     = document.getElementById('time-total');
const stateIcon = document.getElementById('state-icon');

function fmt(s){
  s=Math.max(0,Math.floor(s||0));
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;
  return h>0?`${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`:`${m}:${String(ss).padStart(2,'0')}`;
}

let hideTimer=null;
function showOverlay(dur=4000){
  overlay.classList.add('show');
  clearTimeout(hideTimer);
  if(dur>0)hideTimer=setTimeout(()=>overlay.classList.remove('show'),dur);
}

// metadata
pm.addEventListener(cast.framework.events.EventType.MEDIA_STATUS, e=>{
  const ms=pm.getMediaInformation();
  if(!ms)return;
  const meta=ms.metadata||{};
  if(meta.metadataType===2){
    // serial
    seriesEl.textContent=meta.seriesTitle||'';
    titleEl.textContent=`S${meta.seasonNumber||''}:E${meta.episodeNumber||''} ${meta.title||''}`.trim();
  } else {
    seriesEl.textContent='';
    titleEl.textContent=meta.title||'';
  }
  subtitleEl.textContent=meta.subtitle||'';
  const dur=pm.getDurationSec()||ms.duration||0;
  totEl.textContent=fmt(dur);
});

// progres
pm.addEventListener(cast.framework.events.EventType.TIME_UPDATE, ()=>{
  const cur=pm.getCurrentTimeSec()||0;
  const dur=pm.getDurationSec()||0;
  curEl.textContent=fmt(cur);
  if(dur>0)fillEl.style.width=(cur/dur*100).toFixed(2)+'%';
});

// play/pause overlay
pm.addEventListener(cast.framework.events.EventType.PLAYER_LOAD_COMPLETE, ()=>{
  showOverlay(5000);
});
pm.addEventListener(cast.framework.events.EventType.PAUSE, ()=>{
  stateIcon.textContent='⏸';stateIcon.classList.add('show');
  showOverlay(0);
});
pm.addEventListener(cast.framework.events.EventType.PLAY, ()=>{
  stateIcon.classList.remove('show');
  showOverlay(3000);
});
pm.addEventListener(cast.framework.events.EventType.SEEK, ()=>{
  showOverlay(3000);
});

// interceptor pentru subtitluri externe VTT
pm.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, req=>{
  const mi=req.media;
  if(mi&&mi.textTrackStyle){
    mi.textTrackStyle.backgroundColor='#00000000';
    mi.textTrackStyle.edgeType=cast.framework.messages.TextTrackEdgeType.DROP_SHADOW;
    mi.textTrackStyle.edgeColor='#000000FF';
    mi.textTrackStyle.fontScale=1.1;
  }
  return req;
});

ctx.start(opts);
</script>
</body>
</html>
