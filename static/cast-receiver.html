<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CineVerse</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; width: 100vw; height: 100vh; overflow: hidden; font-family: Arial, sans-serif; }
cast-media-player { width: 100vw; height: 100vh; display: block; opacity: 0; transition: opacity 0.6s; }
cast-media-player.visible { opacity: 1; }
#splash {
  position: fixed;
  inset: 0;
  background: #0d1117;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  transition: opacity 0.6s;
}
#splash.hidden { opacity: 0; pointer-events: none; }
.logo { font-size: 72px; font-weight: 900; letter-spacing: 8px; color: #fff; text-transform: uppercase; }
.logo span { color: #e50914; }
.tagline { font-size: 14px; color: #555; letter-spacing: 4px; text-transform: uppercase; margin-top: 12px; }
.spinner { margin-top: 48px; width: 40px; height: 40px; border: 3px solid #222; border-top-color: #e50914; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="splash">
  <div class="logo"><span>CINE</span>VERSE</div>
  <div class="tagline">by NetStreaming</div>
  <div class="spinner"></div>
</div>
<cast-media-player></cast-media-player>
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script>
var context = cast.framework.CastReceiverContext.getInstance();
context.getPlayerManager().addEventListener(
  cast.framework.events.EventType.PLAYER_LOAD_COMPLETE,
  function() {
    document.getElementById('splash').classList.add('hidden');
    document.querySelector('cast-media-player').classList.add('visible');
  }
);
context.start();
</script>
</body>
</html>
